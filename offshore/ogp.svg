<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&amp;display=swap');
    </style>
    <!-- Grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <!-- Dot pattern -->
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="rgba(58,158,143,0.15)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#121212"/>

  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Dot pattern on right side -->
  <rect x="700" y="0" width="500" height="630" fill="url(#dots)"/>

  <!-- Decorative circles (particle effect) -->
  <circle cx="900" cy="180" r="120" fill="none" stroke="rgba(58,158,143,0.08)" stroke-width="1"/>
  <circle cx="900" cy="180" r="200" fill="none" stroke="rgba(58,158,143,0.05)" stroke-width="1"/>
  <circle cx="900" cy="180" r="280" fill="none" stroke="rgba(58,158,143,0.03)" stroke-width="1"/>

  <!-- Teal accent circles -->
  <circle cx="860" cy="140" r="6" fill="rgba(58,158,143,0.5)"/>
  <circle cx="940" cy="220" r="4" fill="rgba(58,158,143,0.35)"/>
  <circle cx="980" cy="160" r="8" fill="rgba(58,158,143,0.25)"/>
  <circle cx="820" cy="240" r="3" fill="rgba(58,158,143,0.4)"/>
  <circle cx="1040" cy="200" r="5" fill="rgba(58,158,143,0.2)"/>
  <circle cx="900" cy="100" r="3" fill="rgba(58,158,143,0.3)"/>
  <circle cx="970" cy="280" r="6" fill="rgba(58,158,143,0.15)"/>

  <!-- Left border accent -->
  <rect x="80" y="80" width="2" height="470" fill="rgba(58,158,143,0.3)"/>

  <!-- Top label line -->
  <line x1="112" y1="112" x2="144" y2="112" stroke="rgba(119,119,119,0.6)" stroke-width="1"/>
  <text x="156" y="117" font-family="'Jost', 'Arial', sans-serif" font-size="11" font-weight="400" fill="rgba(119,119,119,0.8)" letter-spacing="3">VIETNAM OFFSHORE STAFFING SERVICE</text>

  <!-- Logo: St.Arkid -->
  <text x="112" y="220" font-family="'Jost', 'Arial', sans-serif" font-size="72" font-weight="500" fill="#ffffff" letter-spacing="4">St</text>
  <text x="196" y="220" font-family="'Jost', 'Arial', sans-serif" font-size="72" font-weight="500" fill="#3a9e8f" letter-spacing="4">.</text>
  <text x="214" y="220" font-family="'Jost', 'Arial', sans-serif" font-size="72" font-weight="500" fill="#ffffff" letter-spacing="4">Arkid</text>

  <!-- / Offshore sub label -->
  <text x="116" y="258" font-family="'Jost', 'Arial', sans-serif" font-size="18" font-weight="400" fill="rgba(119,119,119,0.8)" letter-spacing="5">/ OFFSHORE</text>

  <!-- Divider -->
  <line x1="112" y1="292" x2="460" y2="292" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Tagline JP -->
  <text x="112" y="350" font-family="'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="32" font-weight="300" fill="#ffffff">ベトナムの即戦力を、</text>
  <text x="112" y="398" font-family="'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="32" font-weight="300" fill="#3a9e8f">チームに加える。</text>

  <!-- Sub tagline -->
  <text x="112" y="448" font-family="'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="16" font-weight="300" fill="rgba(199,199,199,0.7)">コストを抑えて、品質を上げる。</text>

  <!-- Stats -->
  <text x="112" y="530" font-family="'Jost', 'Arial', sans-serif" font-size="36" font-weight="300" fill="#ffffff">〜60%</text>
  <text x="112" y="556" font-family="'Jost', 'Arial', sans-serif" font-size="11" font-weight="400" fill="rgba(119,119,119,0.8)" letter-spacing="2">COST REDUCTION</text>

  <text x="280" y="530" font-family="'Jost', 'Arial', sans-serif" font-size="36" font-weight="300" fill="#ffffff">6+</text>
  <text x="280" y="556" font-family="'Jost', 'Arial', sans-serif" font-size="11" font-weight="400" fill="rgba(119,119,119,0.8)" letter-spacing="2">ROLES AVAILABLE</text>

  <text x="400" y="530" font-family="'Jost', 'Arial', sans-serif" font-size="36" font-weight="300" fill="#ffffff">2W</text>
  <text x="400" y="556" font-family="'Jost', 'Arial', sans-serif" font-size="11" font-weight="400" fill="rgba(119,119,119,0.8)" letter-spacing="2">FASTEST ONBOARDING</text>

  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="4" fill="#3a9e8f" opacity="0.6"/>

  <!-- Domain label -->
  <text x="1110" y="600" font-family="'Jost', 'Arial', sans-serif" font-size="13" font-weight="400" fill="rgba(119,119,119,0.5)" text-anchor="end" letter-spacing="1">st.arkid.jp/offshore</text>
</svg>
