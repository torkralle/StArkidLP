<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="rgba(66,144,182,0.15)"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#121212"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="700" y="0" width="500" height="630" fill="url(#dots)"/>

  <!-- Decorative circles -->
  <circle cx="900" cy="200" r="130" fill="none" stroke="rgba(66,144,182,0.08)" stroke-width="1"/>
  <circle cx="900" cy="200" r="210" fill="none" stroke="rgba(66,144,182,0.05)" stroke-width="1"/>
  <circle cx="900" cy="200" r="290" fill="none" stroke="rgba(66,144,182,0.03)" stroke-width="1"/>

  <!-- Accent dots -->
  <circle cx="860" cy="150" r="6" fill="rgba(66,144,182,0.5)"/>
  <circle cx="945" cy="230" r="4" fill="rgba(66,144,182,0.35)"/>
  <circle cx="990" cy="170" r="8" fill="rgba(66,144,182,0.25)"/>
  <circle cx="820" cy="260" r="3" fill="rgba(66,144,182,0.4)"/>
  <circle cx="1050" cy="210" r="5" fill="rgba(66,144,182,0.2)"/>
  <circle cx="905" cy="110" r="3" fill="rgba(66,144,182,0.3)"/>
  <circle cx="975" cy="290" r="6" fill="rgba(66,144,182,0.15)"/>

  <!-- Left border -->
  <rect x="80" y="80" width="2" height="470" fill="rgba(66,144,182,0.3)"/>

  <!-- Top label -->
  <line x1="112" y1="112" x2="144" y2="112" stroke="rgba(119,119,119,0.6)" stroke-width="1"/>
  <text x="156" y="117" font-family="'Jost','Arial',sans-serif" font-size="11" font-weight="400" fill="rgba(119,119,119,0.8)" letter-spacing="3">AI · DEV · NOTION · OFFSHORE · CARLEASE · DRIVER</text>

  <!-- Logo -->
  <text x="112" y="220" font-family="'Jost','Arial',sans-serif" font-size="72" font-weight="500" fill="#ffffff" letter-spacing="4">St</text>
  <text x="196" y="220" font-family="'Jost','Arial',sans-serif" font-size="72" font-weight="500" fill="#4290b6" letter-spacing="4">.</text>
  <text x="214" y="220" font-family="'Jost','Arial',sans-serif" font-size="72" font-weight="500" fill="#ffffff" letter-spacing="4">Arkid</text>

  <!-- Sub label -->
  <text x="116" y="258" font-family="'Jost','Arial',sans-serif" font-size="14" font-weight="400" fill="rgba(119,119,119,0.7)" letter-spacing="4">TECHNOLOGY COMPANY · SAPPORO</text>

  <!-- Divider -->
  <line x1="112" y1="292" x2="460" y2="292" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Tagline -->
  <text x="112" y="350" font-family="'Noto Sans JP','Yu Gothic','Hiragino Sans',sans-serif" font-size="32" font-weight="300" fill="#ffffff">テクノロジーを、</text>
  <text x="112" y="398" font-family="'Noto Sans JP','Yu Gothic','Hiragino Sans',sans-serif" font-size="32" font-weight="300" fill="#4290b6">暮らしの言語に。</text>

  <!-- Sub -->
  <text x="112" y="448" font-family="'Noto Sans JP','Yu Gothic','Hiragino Sans',sans-serif" font-size="15" font-weight="300" fill="rgba(199,199,199,0.65)">AI活用・開発マネジメント・オフショア人材紹介・学生カーリース・ドライバー派遣</text>

  <!-- Service count -->
  <text x="112" y="530" font-family="'Jost','Arial',sans-serif" font-size="36" font-weight="300" fill="#ffffff">8+</text>
  <text x="112" y="556" font-family="'Jost','Arial',sans-serif" font-size="11" font-weight="400" fill="rgba(119,119,119,0.8)" letter-spacing="2">SERVICES</text>

  <text x="230" y="530" font-family="'Jost','Arial',sans-serif" font-size="36" font-weight="300" fill="#ffffff">札幌</text>
  <text x="230" y="556" font-family="'Jost','Arial',sans-serif" font-size="11" font-weight="400" fill="rgba(119,119,119,0.8)" letter-spacing="2">BASED IN SAPPORO</text>

  <!-- Bottom accent -->
  <rect x="0" y="620" width="1200" height="4" fill="#4290b6" opacity="0.6"/>

  <!-- Domain -->
  <text x="1110" y="600" font-family="'Jost','Arial',sans-serif" font-size="13" font-weight="400" fill="rgba(119,119,119,0.5)" text-anchor="end" letter-spacing="1">st.arkid.jp</text>
</svg>
