  <!-- Decorative circles -->
  <circle cx="900" cy="200" r="130" fill="none" stroke="rgba(212,119,29,0.08)" stroke-width="1"/>
  <circle cx="900" cy="200" r="210" fill="none" stroke="rgba(212,119,29,0.05)" stroke-width="1"/>
  <circle cx="900" cy="200" r="290" fill="none" stroke="rgba(212,119,29,0.03)" stroke-width="1"/>

