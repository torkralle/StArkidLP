  <text x="112" y="220" font-family="'Jost','Arial',sans-serif" font-size="72" font-weight="500" fill="#ffffff" letter-spacing="4">St</text>
  <text x="196" y="220" font-family="'Jost','Arial',sans-serif" font-size="72" font-weight="500" fill="#d4771d" letter-spacing="4">.</text>
  <text x="214" y="220" font-family="'Jost','Arial',sans-serif" font-size="72" font-weight="500" fill="#ffffff" letter-spacing="4">Arkid</text>

