  <text x="330" y="530" font-family="'Jost','Arial',sans-serif" font-size="36" font-weight="300" fill="#ffffff">5</text>
  <text x="112" y="556" font-family="'Jost','Arial',sans-serif" font-size="11" font-weight="400" fill="rgba(119,119,119,0.8)" letter-spacing="2">HALF-DAY FROM</text>

