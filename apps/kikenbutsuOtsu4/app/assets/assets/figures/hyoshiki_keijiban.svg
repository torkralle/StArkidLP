<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="'Noto Sans JP','Hiragino Sans',sans-serif"><rect width="680" height="430" fill="#ffffff"/><text x="340" y="30" font-size="20" text-anchor="middle" fill="#222" font-weight="bold">製造所等の標識・掲示板</text><rect x="20" y="60" width="300" height="70" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="170.0" y="102.7" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">危険物製造所</text><text x="170.0" y="152" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">標識: 白地に黒字（幅0.3m以上・長さ0.6m以上）</text><rect x="360" y="60" width="300" height="70" fill="#d32f2f" stroke="#333" stroke-width="2"/><text x="510.0" y="102.7" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold">火気厳禁</text><text x="510.0" y="152" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">第4類など: 赤地に白字</text><rect x="20" y="180" width="300" height="70" fill="#1e5bb8" stroke="#333" stroke-width="2"/><text x="170.0" y="222.7" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold">禁水</text><text x="170.0" y="272" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">禁水性物品など: 青地に白字</text><rect x="360" y="180" width="300" height="70" fill="#e8711a" stroke="#333" stroke-width="2"/><text x="510.0" y="222.0" font-size="20" text-anchor="middle" fill="#111" font-weight="bold">給油中エンジン停止</text><text x="510.0" y="272" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">給油取扱所: 黄赤地に黒字</text><rect x="255" y="300" width="90" height="90" fill="#111111" stroke="#333" stroke-width="2"/><text x="300.0" y="363.2" font-size="52" text-anchor="middle" fill="#f6d000" font-weight="bold">危</text><text x="300.0" y="412" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">移動タンク貯蔵所: 黒地に黄色の反射塗料など（0.3m〜0.4m平方）</text></svg>
