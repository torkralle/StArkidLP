<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 496" width="640" height="496" font-family="'Noto Sans JP','Hiragino Sans',sans-serif"><rect width="640" height="496" fill="#ffffff"/><text x="320" y="30" font-size="20" text-anchor="middle" fill="#222" font-weight="bold">保有空地の幅</text><text x="20" y="62" font-size="16" text-anchor="start" fill="#222" font-weight="bold">製造所（危政令 第9条）</text><rect x="20" y="72" width="600" height="34" fill="#e8eef7" stroke="#888"/><line x1="20" y1="72" x2="20" y2="106" stroke="#888"/><text x="170.0" y="95.12" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">指定数量の倍数</text><line x1="320" y1="72" x2="320" y2="106" stroke="#888"/><text x="470.0" y="95.12" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">空地の幅</text><rect x="20" y="106" width="600" height="34" fill="#ffffff" stroke="#888"/><line x1="20" y1="106" x2="20" y2="140" stroke="#888"/><text x="170.0" y="129.12" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">10 以下</text><line x1="320" y1="106" x2="320" y2="140" stroke="#888"/><text x="470.0" y="129.12" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">3 m以上</text><rect x="20" y="140" width="600" height="34" fill="#f7f7f7" stroke="#888"/><line x1="20" y1="140" x2="20" y2="174" stroke="#888"/><text x="170.0" y="163.12" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">10 を超える</text><line x1="320" y1="140" x2="320" y2="174" stroke="#888"/><text x="470.0" y="163.12" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">5 m以上</text><text x="20" y="208" font-size="16" text-anchor="start" fill="#222" font-weight="bold">屋外タンク貯蔵所（危政令 第11条）</text><rect x="20" y="218" width="600" height="34" fill="#e8eef7" stroke="#888"/><line x1="20" y1="218" x2="20" y2="252" stroke="#888"/><text x="170.0" y="241.12" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">指定数量の倍数</text><line x1="320" y1="218" x2="320" y2="252" stroke="#888"/><text x="470.0" y="241.12" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">空地の幅</text><rect x="20" y="252" width="600" height="34" fill="#ffffff" stroke="#888"/><line x1="20" y1="252" x2="20" y2="286" stroke="#888"/><text x="170.0" y="275.12" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">500 以下</text><line x1="320" y1="252" x2="320" y2="286" stroke="#888"/><text x="470.0" y="275.12" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">3 m以上</text><rect x="20" y="286" width="600" height="34" fill="#f7f7f7" stroke="#888"/><line x1="20" y1="286" x2="20" y2="320" stroke="#888"/><text x="170.0" y="309.12" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">500 を超え 1,000 以下</text><line x1="320" y1="286" x2="320" y2="320" stroke="#888"/><text x="470.0" y="309.12" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">5 m以上</text><rect x="20" y="320" width="600" height="34" fill="#ffffff" stroke="#888"/><line x1="20" y1="320" x2="20" y2="354" stroke="#888"/><text x="170.0" y="343.12" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">1,000 を超え 2,000 以下</text><line x1="320" y1="320" x2="320" y2="354" stroke="#888"/><text x="470.0" y="343.12" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">9 m以上</text><rect x="20" y="354" width="600" height="34" fill="#f7f7f7" stroke="#888"/><line x1="20" y1="354" x2="20" y2="388" stroke="#888"/><text x="170.0" y="377.12" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">2,000 を超え 3,000 以下</text><line x1="320" y1="354" x2="320" y2="388" stroke="#888"/><text x="470.0" y="377.12" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">12 m以上</text><rect x="20" y="388" width="600" height="34" fill="#ffffff" stroke="#888"/><line x1="20" y1="388" x2="20" y2="422" stroke="#888"/><text x="170.0" y="411.12" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">3,000 を超え 4,000 以下</text><line x1="320" y1="388" x2="320" y2="422" stroke="#888"/><text x="470.0" y="411.12" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">15 m以上</text><rect x="20" y="422" width="600" height="34" fill="#f7f7f7" stroke="#888"/><line x1="20" y1="422" x2="20" y2="456" stroke="#888"/><text x="170.0" y="445.12" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">4,000 を超える</text><line x1="320" y1="422" x2="320" y2="456" stroke="#888"/><text x="470.0" y="445.12" font-size="16" text-anchor="middle" fill="#222" font-weight="normal">タンクの直径か高さの大きい方</text><text x="20" y="480" font-size="13" text-anchor="start" fill="#222" font-weight="normal">※4,000 を超える場合も 15 m 未満にはできない</text></svg>
